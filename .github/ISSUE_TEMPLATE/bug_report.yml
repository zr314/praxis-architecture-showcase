name: Bug report
description: Report a reproducible Praxis defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include commands, expected behavior, and redacted output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Praxis version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, architecture, and Node.js version
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials, prompts, and sensitive Tool output.
          required: true
